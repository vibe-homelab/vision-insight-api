[project]
name = "vision-insight-api"
version = "0.2.0"
description = "Self-hosted Vision AI Gateway for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "mlx>=0.24.0",
    "mlx-vlm>=0.4.0",
    "mlx-lm>=0.22.0",
    "mflux>=0.16.9",
    "pillow>=10.4.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.2",
    "huggingface-hub>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
