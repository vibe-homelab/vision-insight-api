# Vision Insight API Configuration
# Updated: 2026-03 — Qwen3-VL, Gemma 3, FLUX (M4 Mac Mini 32GB)
#
# Platform support:
#   macOS (Apple Silicon) - MLX backend: Qwen3-VL, Gemma 3, FLUX
#   Linux (NVIDIA CUDA)   - PyTorch backend: Qwen-Image-2512
#
# Set VISION_PLATFORM=cuda or VISION_PLATFORM=mlx to override auto-detection.

models:
  # ── MLX Models (macOS Apple Silicon) ──────────────────────────

  # Vision Language Models (Image → Text)
  vlm-fast:
    type: "vlm"
    path: "mlx-community/Qwen3-VL-4B-Instruct-4bit"
    hot_reload: true
    backend: "mlx"
    params:
      max_tokens: 1024
      memory_gb: 2.5

  vlm-best:
    type: "vlm"
    path: "mlx-community/Qwen3-VL-8B-Instruct-4bit"
    hot_reload: false
    backend: "mlx"
    params:
      max_tokens: 2048
      memory_gb: 5.0

  # Deep visual reasoning with chain-of-thought (2026-03)
  vlm-thinking:
    type: "vlm"
    path: "mlx-community/Qwen3-VL-8B-Thinking-8bit"
    hot_reload: false
    backend: "mlx"
    params:
      max_tokens: 4096
      memory_gb: 9.0

  # Google Gemma 3 — multilingual vision, 140+ languages (2026-03)
  vlm-gemma:
    type: "vlm"
    path: "mlx-community/gemma-3-12b-it-qat-4bit"
    hot_reload: false
    backend: "mlx"
    params:
      max_tokens: 2048
      memory_gb: 7.0

  # Image Generation (MLX FLUX)
  image-gen:
    type: "diffusion"
    path: "mlx-community/FLUX.1-schnell-4bit-mlx"
    hot_reload: false
    backend: "mlx"
    params:
      default_model: "schnell"
      quantize: 4
      memory_gb: 6.0

  # ── CUDA Models (Linux NVIDIA GPU) ───────────────────────────

  # Image Generation (Qwen-Image-2512 via diffusers)
  image-gen-cuda:
    type: "cuda_diffusion"
    path: "Qwen/Qwen-Image-2512"
    hot_reload: false
    backend: "cuda"
    params:
      torch_dtype: "bfloat16"
      gpu_memory_fraction: 0.92
      num_inference_steps: 50
      true_cfg_scale: 4.0
      max_image_edge: 2048
      memory_gb: 20.0

# Memory Management
memory:
  max_unified_memory_gb: 32
  eviction_threshold_percent: 75
  safety_margin_gb: 0.0

# Gateway Configuration
gateway:
  host: "0.0.0.0"
  port: 8000
  api_key: "default-key-change-me"

# Worker Configuration
workers:
  ports:
    vlm-fast: 8001
    vlm-best: 8002
    vlm-thinking: 8004
    vlm-gemma: 8005
    image-gen: 8003
    image-gen-cuda: 8003

  health_check_interval: 30
  health_check_timeout: 5
  startup_timeout: 300  # CUDA models take longer to load
